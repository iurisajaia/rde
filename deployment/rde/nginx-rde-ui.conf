# TLS on 20000 (API) and 20001 (UI). Node listens on 127.0.0.1:28000 (API) and 127.0.0.1:28001 (web)
# — set API_PORT / FRONTEND_PORT / LISTEN_HOST in supervisord (see rde-ui.ini).

# ─── API only (REST + Swagger + direct WS) ───────────────────────────────────
server {
    listen 20000 ssl;
    server_name bchkhaidze-fbx-rde.fbx.im;

    access_log /var/log/nginx/rde-ui-api.access.log main;
    error_log /var/log/nginx/rde-ui-api.error.log;

    ssl_certificate     /etc/ssl/certs/captain.crt;
    ssl_certificate_key /etc/ssl/private/captain.key;
    include conf/ssl_common.conf;

    error_page 497 https://$host:$server_port$request_uri;

    location /api/ws {
        proxy_pass http://127.0.0.1:28000/api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600;
    }

    location / {
        proxy_pass http://127.0.0.1:28000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 30;
        proxy_read_timeout 3600;
    }
}

# ─── Static UI + same-origin /rde-ui/api → API (WS + HTTP) ───────────────────
server {
    listen 20001 ssl;
    server_name bchkhaidze-fbx-rde.fbx.im;

    access_log /var/log/nginx/rde-ui-web.access.log main;
    error_log /var/log/nginx/rde-ui-web.error.log;

    ssl_certificate     /etc/ssl/certs/captain.crt;
    ssl_certificate_key /etc/ssl/private/captain.key;
    include conf/ssl_common.conf;

    error_page 497 https://$host:$server_port$request_uri;

    location /rde-ui/api/ws {
        proxy_pass http://127.0.0.1:28000/api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600;
    }

    location /rde-ui/api/ {
        proxy_pass http://127.0.0.1:28000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 30;
        proxy_read_timeout 3600;
    }

    location / {
        proxy_pass http://127.0.0.1:28001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 30;
        proxy_read_timeout 60;
    }
}
