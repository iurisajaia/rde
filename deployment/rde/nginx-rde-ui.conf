# Static UI only — built assets under REPO_DIR/dist (base path /rde-ui/).
# Install: sudo cp deployment/rde/nginx-rde-ui.conf /etc/nginx/sites-enabled/rde-ui.conf && sudo nginx -t && sudo nginx -s reload
#
# Replace server_name and ssl paths to match your host.

server {
    listen 20001 ssl;
    server_name rde-ui-bchkhaidze-fbx-rde.fbx.im bchkhaidze-fbx-rde.fbx.im;

    access_log /var/log/nginx/rde-ui-web.access.log main;
    error_log /var/log/nginx/rde-ui-web.error.log;

    ssl_certificate     /etc/ssl/certs/captain.crt;
    ssl_certificate_key /etc/ssl/private/captain.key;
    include conf/ssl_common.conf;

    error_page 497 https://$host:$server_port$request_uri;

    location /rde-ui/ {
        alias /opt/fundbox/rde-ui/dist/;
        index index.html;
    }

    location = /rde-ui {
        return 302 /rde-ui/;
    }

    location / {
        return 302 /rde-ui/;
    }
}
