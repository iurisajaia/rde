[program:rde-ui]
command=/bin/bash /opt/fundbox/rde-ui/deployment/rde/run-rde-ui.sh
directory=/opt/fundbox/rde-ui
user=ubuntu
autostart=true
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/opt/fundbox/logs/rde-ui.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/opt/fundbox/logs/rde-ui.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=API_PORT="28000",LISTEN_HOST="127.0.0.1",NODE_ENV="production",HOME="/home/ubuntu",PATH="/usr/local/bin:/usr/bin:/bin"
