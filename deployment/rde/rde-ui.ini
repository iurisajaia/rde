[program:rde-ui]
; Node API removed — disabled by default. UI is static: nginx serves /opt/fundbox/rde-ui/dist/
command=/bin/bash /opt/fundbox/rde-ui/deployment/rde/run-rde-ui.sh
directory=/opt/fundbox/rde-ui
user=ubuntu
autostart=false
autorestart=false
startsecs=0
startretries=0
stopasgroup=true
killasgroup=true
stdout_logfile=/opt/fundbox/logs/rde-ui.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/opt/fundbox/logs/rde-ui.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
