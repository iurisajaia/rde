[program:rde-ui]
command=/usr/local/nvm/versions/node/v16.20.2/bin/node /opt/fundbox/rde-ui/server.js
directory=/opt/fundbox/rde-ui
user=ubuntu
autostart=true
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/opt/fundbox/logs/rde-ui.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/opt/fundbox/logs/rde-ui.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=API_PORT="28000",FRONTEND_PORT="28001",LISTEN_HOST="127.0.0.1",NODE_ENV="production",HOME="/home/ubuntu",PATH="/usr/local/nvm/versions/node/v16.20.2/bin:/usr/local/bin:/usr/bin:/bin"
